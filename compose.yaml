services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finance_db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_saas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finance_db_data:
